version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: travelmind_db
    environment:
      POSTGRES_USER: travelmind
      POSTGRES_PASSWORD: travelmind_password
      POSTGRES_DB: travelmind_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelmind"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
